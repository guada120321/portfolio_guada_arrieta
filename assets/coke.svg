<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 20" width="96" height="160" shape-rendering="crispEdges" role="img" aria-label="Botella pixel de Coca-Cola en la mano de Guada">
  <style>text { shape-rendering: auto; }</style>
  <!-- tapa -->
  <rect x="4" y="0" width="4" height="1" fill="#14121f"/>
  <rect x="4" y="1" width="4" height="1" fill="#9f1239"/>
  <!-- cuello -->
  <rect x="4" y="2" width="4" height="2" fill="#e52521"/>
  <!-- hombros de la botella contorno -->
  <rect x="3" y="4" width="6" height="2" fill="#e52521"/>
  <!-- cuerpo -->
  <rect x="2" y="6" width="8" height="11" fill="#e52521"/>
  <!-- base -->
  <rect x="3" y="17" width="6" height="1" fill="#b91c1c"/>
  <rect x="3" y="18" width="6" height="1" fill="#14121f"/>
  <!-- brillo -->
  <rect x="3" y="7" width="1" height="9" fill="#fb7185"/>
  <!-- faja blanca ondulada -->
  <path d="M2 10 L4 9 L6 10 L8 9 L10 10 L10 12 L8 11 L6 12 L4 11 L2 12 Z" fill="#f8fafc"/>
  <!-- marcas legibles -->
  <text x="6.2" y="11.7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="2.7" fill="#e52521">Coca</text>
  <text x="6" y="15" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="bold" font-size="2.2" fill="#f8fafc">Cola</text>
</svg>
